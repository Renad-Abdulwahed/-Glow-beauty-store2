<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-box">
        <h1>Add Product ✨</h1>
        <input type="text" id="name" placeholder="Enter Product Name" required>
        <input type="number" id="price" placeholder="Enter Product Price"required>
        <input type="text" id="category" placeholder="Enter Product Category"required>
<!-- غيرنا الـ placeholder ليوضح أنه يستقبل رابط ويب كامل -->
<input type="text" id="image" required placeholder="https://example.com/image.jpg">
        <button onclick="addProduct()">Submit</button>
        <br><br>
        <div id="result"></div>
        <a href="index.html" class="back-btn">Back Home</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
